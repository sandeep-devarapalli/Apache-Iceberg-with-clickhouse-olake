services:
  # MySQL 8.0 with CDC enabled
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: demo_db
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_password
    command: >
      --log-bin=mysql-bin --server-id=1 --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON --log-slave-updates=ON --binlog-row-image=FULL
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - clickhouse_lakehouse-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Postgres for Iceberg REST metadata
  postgres:
    image: postgres:15
    container_name: postgres
    networks:
      - clickhouse_lakehouse-net
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iceberg
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg" ]
      interval: 2s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data

  # MinIO S3 Storage (matching standalone config)
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9090:9090"
      - "9091:9091"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_DOMAIN: minio
    command: server --address ":9090" --console-address ":9091" /data
    networks:
      clickhouse_lakehouse-net:
        aliases:
          - warehouse.minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (mc) - bucket init (warehouse + olake-data)
  mc:
    image: minio/mc:latest
    container_name: mc
    networks:
      - clickhouse_lakehouse-net
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set minio http://minio:9090 admin password) do
        echo '...waiting for minio...' && sleep 1;
      done; echo 'Ensuring warehouse bucket exists and is public...'; if /usr/bin/mc stat minio/warehouse > /dev/null 2>&1; then
        echo 'Warehouse bucket exists, removing for fresh start...';
        /usr/bin/mc rm -r --force minio/warehouse || echo 'Failed to remove warehouse, proceeding...';
      fi; /usr/bin/mc mb minio/warehouse; /usr/bin/mc anonymous set public minio/warehouse;

      echo 'Ensuring olake-data bucket exists and is public...'; /usr/bin/mc mb minio/olake-data --ignore-existing; /usr/bin/mc anonymous set public minio/olake-data;

      echo 'MinIO buckets setup complete.'; "

  # Initialize test table for OLake connection testing
  init-test-table:
    image: curlimages/curl:latest
    container_name: init-test-table
    networks:
      - clickhouse_lakehouse-net
    volumes:
      - ./scripts:/scripts
    depends_on:
      iceberg-rest:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    entrypoint: [ "/bin/sh", "/scripts/create-test-table-init.sh" ]

  # Iceberg REST Catalog (standalone config, adapted name)
  iceberg-rest:
    image: tabulario/iceberg-rest:0.6.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    volumes:
      - catalog-data:/catalog
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9090
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: password
    networks:
      - clickhouse_lakehouse-net
    depends_on:
      postgres:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8181' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ClickHouse Server with Iceberg support
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123" # HTTP interface
      - "19000:9000" # Native interface
      - "19004:9004" # MySQL interface
    volumes:
      - ./clickhouse-config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse-config/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./clickhouse-config/minio-iceberg.xml:/etc/clickhouse-server/config.d/minio-iceberg.xml
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9090
      AWS_S3_FORCE_PATH_STYLE: "true"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    networks:
      - clickhouse_lakehouse-net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ClickHouse Client
  clickhouse-client:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-client
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    networks:
      - clickhouse_lakehouse-net
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # MySQL Client
  mysql-client:
    image: mysql:8.0
    container_name: mysql-client
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    networks:
      - clickhouse_lakehouse-net
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  # Auto-connect OLake test containers to network
  olake-auto-connect:
    image: docker:latest
    container_name: olake-auto-connect
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    networks:
      - clickhouse_lakehouse-net
    command: >
      sh -c "apk add --no-cache bash && chmod +x /scripts/auto-connect-olake-containers.sh && /scripts/auto-connect-olake-containers.sh"
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
  clickhouse-data:
  clickhouse-logs:
  catalog-data:


networks:
  clickhouse_lakehouse-net:
    driver: bridge
